<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="rrBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#141426" />
    </radialGradient>
  </defs>
  <!-- Background circle matching the midnight theme -->
  <circle cx="32" cy="32" r="30" fill="url(#rrBg)" stroke="#f2c14e" stroke-width="3" />
  <!-- Delicate inner golden accent ring -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#f2c14e" stroke-opacity="0.35" stroke-width="1" />
  <!-- Monogram rr. in elegant italic serif typography -->
  <text 
    x="30" 
    y="42" 
    text-anchor="middle" 
    font-family="'Fraunces', 'Playfair Display', 'Didot', 'Georgia', serif" 
    font-size="31" 
    font-style="italic" 
    font-weight="700" 
    fill="#f2c14e" 
    letter-spacing="-3">rr.</text>
</svg>
